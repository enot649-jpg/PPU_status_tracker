version: '3.8'

services:

  db:
    image: postgres:16-alpine
    container_name: status_db
    env_file: 
      - .env 
    networks: 
      - status_net
    volumes: 
      - postgres_data:/var/lib/postgresql/data

  status:
    build: ./PPU/
    container_name: status_web
    command: python manage.py runserver 0.0.0.0:8000
    env_file: 
      - .env 
    depends_on: 
      - db
    networks: 
      - status_net
    ports:
      - "8000:8000"

volumes:
  postgres_data:

networks:
  status_net:
    driver: bridge